<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Beginner classroom simulations for practicing collaborative active learning techniques.">
<title>Active Learning Sims</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: home = grouped technique cards; sim = classroom canvas left, one step card right; stacks on phones */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f7; --floor:#fafafa; --ink:#1f2328; --muted:#5c6066; --line:#dcdcd9;
  --accent:#1f4e79; --accent-ink:#ffffff; --dot-ink:#14212b; --stu:#b3b5b9; --note:#ffe27a;
  --sdt:#56b4e9; --ev:#e69f00; --attr:#e8774a; --goal:#d98cb8;
  --good:#2e7d4f; --mid:#8f5f00; --bad:#b23a2e;
  --good-bg:#e6f2ea; --mid-bg:#fbf1dc; --bad-bg:#fbe8e5;
  --display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141517; --surface:#1c1d20; --surface-2:#232528; --floor:#202225; --ink:#ececec; --muted:#a2a5aa; --line:#35373b;
  --accent:#8db8e3; --accent-ink:#0e1a26; --dot-ink:#14212b; --stu:#94979c; --note:#e8cb5a;
  --sdt:#56b4e9; --ev:#e69f00; --attr:#e8774a; --goal:#d98cb8;
  --good:#6fcf97; --mid:#e8b450; --bad:#f08a7e;
  --good-bg:#17301f; --mid-bg:#33280f; --bad-bg:#3a1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1c1d20; --surface-2:#232528; --floor:#202225; --ink:#ececec; --muted:#a2a5aa; --line:#35373b;
  --accent:#8db8e3; --accent-ink:#0e1a26; --dot-ink:#14212b; --stu:#94979c; --note:#e8cb5a;
  --sdt:#56b4e9; --ev:#e69f00; --attr:#e8774a; --goal:#d98cb8;
  --good:#6fcf97; --mid:#e8b450; --bad:#f08a7e;
  --good-bg:#17301f; --mid-bg:#33280f; --bad-bg:#3a1d19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:600;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:600;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.sub{color:var(--muted);max-width:62ch}
header{display:grid;gap:14px}

.stepper{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.stepper li{font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.stepper li.done{color:var(--ink)}
.stepper li.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.panel.main{display:grid;gap:18px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.dialogue{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;font-family:var(--display)}
.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px}
.bubble b{display:block;font-size:.8rem;color:var(--muted)}

.options{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;
  font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:.85rem}
.opt:disabled{cursor:default;opacity:.55}
.opt.picked{opacity:1;border-color:var(--accent);background:var(--surface-2)}

.fb{border-radius:10px;padding:16px;display:grid;gap:8px;border:1px solid var(--line)}
.fb.strong{background:var(--good-bg)} .fb.mixed{background:var(--mid-bg)} .fb.weak{background:var(--bad-bg)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.pill.strong{color:var(--good)} .pill.mixed{color:var(--mid)} .pill.weak{color:var(--bad)}
.deltas{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}

.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px}

.meters{display:grid;gap:14px}
.meter{display:grid;gap:5px}
.meter .top{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.meter .top span:last-child{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.meter small{color:var(--muted);font-size:.8rem}

.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.table{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface-2)}
.table h3{font-size:.85rem}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seat{display:flex;align-items:center;gap:6px;font-size:.8rem;min-width:0}
.seat .dot{width:14px;height:14px;border-radius:50%;flex:none}
.seat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.focus span{font-weight:700}
.seat.focus .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

details{border-top:1px solid var(--line);padding-block:10px}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
summary .dot{width:12px;height:12px;border-radius:50%}
details p{margin-top:8px;font-size:.92rem}
details p.miss{color:var(--muted)}

.recap{display:grid;gap:10px}
.recap-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.recap-item p{font-size:.9rem;color:var(--muted)}
.list{margin:0;padding-left:20px;display:grid;gap:6px}
.line.you .bubble{background:var(--surface);border-color:var(--accent);border-radius:12px 4px 12px 12px}
.narr{font-style:italic;color:var(--muted);font-size:.93rem;padding-left:44px}
.coach{border-radius:10px;padding:14px 16px;display:grid;gap:6px;border:1px solid var(--line);margin-left:44px}
.coach.strong{background:var(--good-bg)} .coach.mixed{background:var(--mid-bg)} .coach.weak{background:var(--bad-bg)}
@media (max-width:520px){.narr,.coach{padding-left:0;margin-left:0}.coach{padding-left:14px}}
.composer{display:grid;gap:10px}
.composer label{font-weight:700}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:96px;resize:vertical;width:100%}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.9rem}
.err{color:var(--bad);font-size:.9rem}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.93rem;padding-left:44px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.examples{display:grid;gap:6px;margin-top:8px}
.ex{font:inherit;font-size:.88rem;text-align:left;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.ex:hover{border-color:var(--accent)}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.mode i{width:8px;height:8px;border-radius:50%;background:currentColor}
.mode.off{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.roompanel{display:grid;gap:12px}
#room{display:block;width:100%;aspect-ratio:800/580;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);touch-action:manipulation;cursor:pointer}
#room:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--muted)}
kbd{font-family:inherit;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface);color:var(--ink)}
@media (min-width:821px){.roompanel{position:sticky;top:16px}}

.stepnum{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;color:var(--accent)}
.tip{font-size:.92rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.opt.right{border-color:var(--good);background:var(--good-bg);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:1}
.stepper button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
.stepper li:has(button:hover){border-color:var(--accent)}
.stepper button:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:4px}
.navrow{border-top:1px solid var(--line);padding-top:14px}
.checklist{display:grid;gap:8px}
.ck-head{display:grid;gap:6px;margin-bottom:4px}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ck-name{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.ck-name i{width:12px;height:12px;border-radius:50%;flex:none}
.ck .ex{padding:6px 14px}
.steps-list{margin:0;padding-left:22px;display:grid;gap:8px}
a{color:var(--accent)}

.hgroup{display:grid;gap:12px}
.hgroup h2{font-size:1.25rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:grid;gap:6px;align-content:start;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card-name{font-family:var(--display);font-weight:700;font-size:1.12rem}
.card-blurb{font-size:.93rem;color:var(--muted)}
.card-meta{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card-go{font-weight:700;color:var(--accent);margin-top:2px}
#home{display:grid;gap:28px}
#home[hidden],#simview[hidden]{display:none!important}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:10px 0 6px;font-size:.9rem}
.facts dt{font-weight:700} .facts dd{margin:0;color:var(--muted)}
.ext{display:inline-block;margin-top:10px;font-weight:700;font-size:.92rem}
a.btn{text-decoration:none;display:inline-block}
.btn.small{padding:7px 12px;font-size:.88rem}
</style>
<style>[hidden]{display:none!important} img{max-width:100%} body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><button class="btn ghost small" id="homeBtn" hidden>← All techniques</button></div>
    <div class="eyebrow" id="eyebrow">Beginner walkthroughs</div>
    <h1 id="h1">Active Learning Sims</h1>
    <p class="sub" id="sub"></p>
    <ol class="stepper" id="stepper" hidden></ol>
  </header>

  <div id="home"></div>

  <div class="grid" id="simview" hidden>
    <section class="panel roompanel">
      <canvas id="room" tabindex="0" aria-label="Top-down classroom with 16 students. Click a glowing spot, or press Space, to walk the teacher there."></canvas>
      <div class="legend" id="legend" style="margin-top:0"></div>
    </section>
    <aside class="side">
      <section class="panel main" id="stage" aria-live="polite"></section>
      <div class="panel" id="about"></div>
    </aside>
  </div>
</div>

<script>
/* ===================== Shared class, room and layouts ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const W = 800, H = 580, SPEED = 240;
const BOARD = {x:160, y:16, w:480, h:58}, TOP = {x:400, y:106};
const TEAMS = [["Maya","Jordan","Marcus","Lena"],["Daniel","Priya","Sam","Hannah"],["Omar","Grace","Leo","Fatima"],["Elena","Chris","Aisha","Noah"]];
const ALL = TEAMS.flat();
const TEAM_OF = {}; TEAMS.forEach((t,i)=>t.forEach(n=>TEAM_OF[n]=i));
const KEYS = ["sdt","ev","attr","goal"];
const O = (t, ok, f) => ({t, ok:!!ok, f});
const GROUP_LEGEND = [["Group 1","sdt"],["Group 2","ev"],["Group 3","attr"],["Group 4","goal"]];

/* round tables, four seats each */
const TBL = [{x:225,y:245},{x:575,y:245},{x:225,y:450},{x:575,y:450}];
const SEAT = [[0,-80],[80,0],[0,80],[-80,0]];
function L_tables(groups, labels, keys, tbl){
  tbl = tbl || TBL; const furn = [], pos = {};
  groups.forEach((g,i)=>{ const t = tbl[i];
    furn.push({type:"table", x:t.x, y:t.y, r:54, label:labels ? labels[i] : "", key:keys ? keys[i] : null});
    g.forEach((n,si)=>pos[n] = {x:t.x+SEAT[si][0], y:t.y+SEAT[si][1]}); });
  return {furn, pos};
}
/* pair desks */
const PC = [[140,215],[307,215],[493,215],[660,215],[140,430],[307,430],[493,430],[660,430]];
const PAIRS = [0,1,2,3,4,5,6,7].map(i=>[ALL[2*i], ALL[2*i+1]]);
function L_pairs(){
  const furn = [], pos = {};
  PC.forEach(([x,y],i)=>{ furn.push({type:"desk", x:x-58, y:y-14, w:116, h:28});
    pos[PAIRS[i][0]] = {x:x-28, y:y+36}; pos[PAIRS[i][1]] = {x:x+28, y:y+36}; });
  return {furn, pos};
}
/* lecture rows, neighbours share a desk */
const ROWY = [170,280,390,500], ROWX = [185,285,515,615];
function L_rows(extra){
  const furn = [], pos = {};
  ROWY.forEach((y,r)=>{
    furn.push({type:"desk", x:ROWX[0]-45, y:y-44, w:ROWX[1]-ROWX[0]+90, h:20});
    furn.push({type:"desk", x:ROWX[2]-45, y:y-44, w:ROWX[3]-ROWX[2]+90, h:20});
    TEAMS[r].forEach((n,c)=>pos[n] = {x:ROWX[c], y}); });
  return {furn:[...(extra||[]), ...furn], pos};
}
/* four corners */
const ZONES = {A:{x:16,y:96,w:240,h:190}, B:{x:544,y:96,w:240,h:190}, C:{x:16,y:374,w:240,h:190}, D:{x:544,y:374,w:240,h:190}};
function L_corners(assign, labels){
  const furn = Object.keys(ZONES).map(k=>({type:"zone", ...ZONES[k], letter:k, label:labels[k]})), pos = {};
  Object.entries(assign).forEach(([k,names])=>{ const z = ZONES[k];
    names.forEach((n,i)=>pos[n] = {x:z.x+50+(i%3)*70, y:z.y+82+Math.floor(i/3)*60}); });
  return {furn, pos};
}
/* gallery posters */
const POST = [{x:24,y:130},{x:666,y:130},{x:24,y:385},{x:666,y:385}];
const GC = [{x:235,y:175},{x:565,y:175},{x:235,y:430},{x:565,y:430}];
const OFF = [[-24,-24],[24,-24],[-24,24],[24,24]];
const posters = labels => POST.map((p,i)=>({type:"poster", x:p.x, y:p.y, w:110, h:86, label:labels[i]}));
function L_gallery(groups, labels){
  const furn = posters(labels), pos = {};
  groups.forEach((g,i)=>g.forEach((n,j)=>pos[n] = {x:GC[i].x+OFF[j][0], y:GC[i].y+OFF[j][1]}));
  return {furn, pos};
}
/* stage at the front + tables */
const STAGE = {x:250, y:88, w:300, h:72};
const TBL2 = [{x:200,y:290},{x:600,y:290},{x:200,y:470},{x:600,y:470}];
function L_stage(perf, labels, keys){
  const L = L_tables(TEAMS.map((t,i)=>i===perf ? [] : t), labels, keys, TBL2);
  L.furn.unshift({type:"zone", ...STAGE, letter:"", label:"Stage"});
  TEAMS[perf].forEach((n,j)=>L.pos[n] = {x:STAGE.x+60+j*60, y:STAGE.y+44});
  return L;
}
/* fishbowl */
const CX = 400, CY = 322, RIN = 70, ROUT = 185;
const fpt = (r,a) => ({x:CX+r*Math.cos(a*Math.PI/180), y:CY+r*Math.sin(a*Math.PI/180)});
const FIN = [0,72,144,216,288].map(a=>fpt(RIN,a));
const FOUT = Array.from({length:12}, (_,k)=>fpt(ROUT, 15+30*k));
function L_fishbowl(inner, outer){
  const furn = [{type:"ring", x:CX, y:CY, r:ROUT+30}, {type:"rug", x:CX, y:CY, r:RIN+30, label:"INNER\nCIRCLE"}];
  [...FIN, ...FOUT].forEach(p=>furn.push({type:"chair", x:p.x, y:p.y}));
  furn.push({type:"text", x:FIN[0].x, y:FIN[0].y, label:"empty"});
  const pos = {}; inner.forEach((n,i)=>pos[n] = FIN[i+1]); outer.forEach((n,i)=>pos[n] = FOUT[i]);
  return {furn, pos};
}
/* places the teacher can visit */
const R = {
  pair: i => ({x:PC[i][0], y:PC[i][1]+14, r:64}),
  table: i => ({x:TBL[i].x, y:TBL[i].y, r:112}),
  table2: i => ({x:TBL2[i].x, y:TBL2[i].y, r:112}),
  row: i => { const r = Math.floor(i/2), s = i%2; return {x:s?565:235, y:ROWY[r]-12, r:64, stand:{x:s?455:345, y:ROWY[r]}}; },
  corner: k => { const z = ZONES[k], left = k==="A"||k==="C"; return {x:z.x+z.w/2, y:z.y+z.h/2+10, r:108, stand:{x:left ? z.x+z.w+34 : z.x-34, y:z.y+z.h/2+10}}; },
  poster: i => ({x:(POST[i].x+55+GC[i].x)/2, y:GC[i].y, r:118})
};
/* props */
const env = (id, t, tbl) => ({id, kind:"env", x:(tbl||TBL)[t].x+18, y:(tbl||TBL)[t].y+12});
const JUMBLE = [[-30,-22],[6,-30],[-14,2],[22,8],[-26,26],[12,30]];
const strips = (ordered, done) => TBL.flatMap((t,ti)=>JUMBLE.map((o,k)=>({id:`s${ti}${k}`, kind:"strip",
  x: ordered[ti] ? t.x : t.x+o[0], y: ordered[ti] ? t.y-28+k*11 : t.y+o[1], done:!!done})));
const notes = counts => counts.flatMap((c,i)=>Array.from({length:c}, (_,k)=>({id:`n${i}${k}`, kind:"note",
  x:POST[i].x+22+(k%3)*33, y:POST[i].y+42+Math.floor(k/3)*22})));
/* ===================== The simulations ===================== */

const step = () => sim.steps[S.idx];
const solved = (opts, tr) => (tr||[]).some(j=>opts[j].ok);

const round = (i=S.idx) => (S.rounds[i] ||= {cur:null, tried:{}, seen:{}});
function visitDone(i, t){ const r = round(i), v = sim.steps[i].visits[t]; return v.opts ? solved(v.opts, r.tried[t]) : !!r.seen[t]; }
const roundDone = (i=S.idx) => sim.steps[i].visits.every((_,t)=>visitDone(i,t));
function canAdvance(){
  const st = step();
  if(st.kind==="decide") return solved(st.opts, S.tried[S.idx]);
  if(st.kind==="round") return roundDone();
  return S.idx < sim.steps.length-1;
}
const standOf = g => g.stand || (g.y-g.r-10 >= 100 ? {x:g.x, y:g.y-g.r-10} : {x:g.x, y:Math.min(H-30, g.y+g.r+10)});
const spotOf = st => (!st.spot || st.spot==="board") ? null : st.spot;
const colorKey = n => !sim.legend ? "stu" : (sim.colorOf ? sim.colorOf(n) : KEYS[TEAM_OF[n]]);

function applyLayout(name, instant){

}
function applyProps(list, instant){

  propPos = next;
}
function sayAs(name, text, ms){ const s = students.find(x=>x.name===name); if(s){ s.say = text; s.until = performance.now()+(ms||4200); } }
function clearSpeech(){ students.forEach(s=>s.until = 0); }
function walkTo(p, cb){
  teacher.tx = p.x; teacher.ty = p.y;

function targets(){
  const st = step();
  if(st.kind==="decide") return S.arrived[S.idx] ? [] : [spotOf(st) || "board"];
  if(st.kind==="round"){ const r = round(); return st.visits.map((_,t)=>t).filter(t=>!visitDone(S.idx,t) && r.cur!==t).map(t=>st.visits[t].region); }
  return [];
}
function goToDecide(){
  const st = step(), sp = spotOf(st);
  walkTo(sp ? standOf(sp) : TOP, ()=>{ S.arrived[S.idx] = true; (st.lines||[]).forEach(([n,l],i)=>setTimeout(()=>sayAs(n,l,5000), i*1500)); render(); });
}
function visit(t){
  const st = step(), r = round();
  clearSpeech(); r.cur = null; render();
  walkTo(standOf(st.visits[t].region), ()=>{
    r.cur = t; const v = st.visits[t];
    if(!v.opts) r.seen[t] = true;
    v.lines.forEach(([n,l],i)=>setTimeout(()=>sayAs(n,l,5200), 200+i*1500));
    render();
    if(window.innerWidth < 820) $("stage").scrollIntoView({behavior:"smooth", block:"start"});
  });
}
cv.addEventListener("pointerdown", e=>{
  if(!sim) return;
  const st = step(), b = cv.getBoundingClientRect(), x = (e.clientX-b.left)/b.width*W, y = (e.clientY-b.top)/b.height*H;
  if(st.kind==="decide" && !S.arrived[S.idx]){
    const sp = spotOf(st);
    const hit = sp ? Math.hypot(x-sp.x, y-sp.y) < sp.r : (y < 120 && Math.abs(x-400) < 250);
    if(hit) goToDecide();
  } else if(st.kind==="round"){
    const hits = st.visits.map((v,t)=>[t, Math.hypot(x-v.region.x, y-v.region.y), v.region.r]).filter(h=>h[1]<h[2]).sort((a,b)=>a[2]-b[2]);
    if(hits.length && round().cur!==hits[0][0]) visit(hits[0][0]);
  }
});
cv.addEventListener("keydown", e=>{
  if(!sim || (e.key!==" " && e.key!=="Enter")) return;
  const st = step();
  if(st.kind==="decide" && !S.arrived[S.idx]){ e.preventDefault(); goToDecide(); }
  else if(st.kind==="round"){ const t = st.visits.findIndex((_,i)=>!visitDone(S.idx,i)); if(t>=0){ e.preventDefault(); visit(t); } }
});

function update(dt){
  if(teacher.tx!==null){
    const dx = teacher.tx-teacher.x, dy = teacher.ty-teacher.y, d = Math.hypot(dx,dy);
    if(d < 5){ teacher.tx = null; const f = teacher.onArrive; teacher.onArrive = null; if(f) f(); }
    else {
      let vx = dx/d, vy = dy/d;
      const B = sim.block;
      if(B){ const ox = teacher.x-B.x, oy = teacher.y-B.y, od = Math.hypot(ox,oy)||1;
        if(od < B.r+24 && -(vx*ox+vy*oy)/od > 0){ const tx = -oy/od, ty = ox/od, side = (tx*dx+ty*dy) >= 0 ? 1 : -1;
          vx = vx*.3+tx*side*.9; vy = vy*.3+ty*side*.9; const m = Math.hypot(vx,vy); vx /= m; vy /= m; } }
      const stp = Math.min(d, SPEED*dt); teacher.x += vx*stp; teacher.y += vy*stp; teacher.walk += dt*11;
    }
  }
  if(sim.block){ const B = sim.block, ox = teacher.x-B.x, oy = teacher.y-B.y, od = Math.hypot(ox,oy)||1; if(od < B.r){ teacher.x = B.x+ox/od*B.r; teacher.y = B.y+oy/od*B.r; } }
  teacher.x = Math.max(24, Math.min(W-24, teacher.x)); teacher.y = Math.max(92, Math.min(H-24, teacher.y));
  const k = Math.min(1, dt*2.2);
  students.forEach(s=>{ s.x += (s.tx-s.x)*k; s.y += (s.ty-s.y)*k; });
  Object.values(propPos).forEach(p=>{ p.cx += (p.x-p.cx)*Math.min(1, dt*2.6); p.cy += (p.y-p.cy)*Math.min(1, dt*2.6); });
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(text, maxW, maxLines){
  const words = String(text).split(/\s+/), lines = []; let line = "";
  for(const w of words){ const t = line ? line+" "+w : w; if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if(line) lines.push(line);
  if(lines.length > maxLines){ lines.length = maxLines; lines[maxLines-1] += "…"; }
  return lines;
}
const FONT = (w,s,disp) => `${w} ${s}px ${disp ? '"Lexend"' : '"Atkinson Hyperlegible"'}, system-ui, sans-serif`;
function bubble(x, y, text, strong){
  ctx.font = FONT(strong?700:400, 12.5);
  const lines = wrap(text, 180, 3), w = Math.max(...lines.map(l=>ctx.measureText(l).width))+18, h = lines.length*16+12;
  const bx = Math.max(6, Math.min(W-w-6, x-w/2)), by = Math.max(6, y-h-10);
  ctx.fillStyle = strong ? C.accent : C.surface; ctx.strokeStyle = strong ? C.accent : C.line; ctx.lineWidth = 1.5;
  rr(bx,by,w,h,8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-6,by+h-1); ctx.lineTo(x+6,by+h-1); ctx.lineTo(x,by+h+7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = strong ? C.accentInk : C.ink; ctx.textAlign = "left"; ctx.textBaseline = "top";
  lines.forEach((l,i)=>ctx.fillText(l, bx+9, by+7+i*16));
}
function badge(x, y, done, pulse){
  x = Math.max(16, Math.min(W-16, x)); y = Math.max(16, Math.min(H-16, y));
  ctx.fillStyle = done ? C.good : C.accent;
  ctx.beginPath(); ctx.arc(x, y, done ? 12 : 13+pulse*1.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = done ? C.surface : C.accentInk; ctx.font = FONT(700,14,1); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(done ? "✓" : "!", x, y+1);
}
function centerText(lines, x, y, lh){ const n = lines.length; lines.forEach((l,i)=>ctx.fillText(l, x, y+(i-(n-1)/2)*lh)); }
function drawFurn(f){
  ctx.lineWidth = 2; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if(f.type==="table"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = f.key ? C[f.key] : C.line; ctx.lineWidth = f.key ? 4 : 2; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.font = FONT(600,12.5,1); centerText(String(f.label).split("\n"), f.x, f.y, 15);
  } else if(f.type==="desk"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = C.line; rr(f.x,f.y,f.w,f.h,4); ctx.fill(); ctx.stroke();
  } else if(f.type==="zone"){
    ctx.strokeStyle = C.line; ctx.setLineDash([6,6]); rr(f.x,f.y,f.w,f.h,12); ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    if(f.letter){ ctx.fillStyle = C.ink; ctx.font = FONT(700,26,1); ctx.fillText(f.letter, f.x+14, f.y+10); ctx.fillStyle = C.muted; ctx.font = FONT(700,12); ctx.fillText(f.label, f.x+14, f.y+44); }
    else { ctx.fillStyle = C.muted; ctx.font = FONT(700,11); ctx.fillText(String(f.label).toUpperCase(), f.x+10, f.y+8); }
  } else if(f.type==="poster"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = C.ink; rr(f.x,f.y,f.w,f.h,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.font = FONT(700,12,1); ctx.fillText(f.label, f.x+f.w/2, f.y+14);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; [26,32].forEach(dy=>{ ctx.beginPath(); ctx.moveTo(f.x+14,f.y+dy); ctx.lineTo(f.x+f.w-14,f.y+dy); ctx.stroke(); });
  } else if(f.type==="ring"){
    ctx.strokeStyle = C.line; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.stroke();
  } else if(f.type==="rug"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = C.line; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font = FONT(700,11); centerText(f.label.split("\n"), f.x, f.y, 14);
  } else if(f.type==="chair"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; rr(f.x-17,f.y-17,34,34,7); ctx.fill(); ctx.stroke();
  } else if(f.type==="text"){
    ctx.fillStyle = C.muted; ctx.font = FONT(400,9.5); ctx.fillText(f.label, f.x, f.y);
  }
}
function drawProp(p){
  const x = p.cx, y = p.cy;
  if(p.kind==="env"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; rr(x-15,y-10,30,20,2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-15,y-10); ctx.lineTo(x,y+1); ctx.lineTo(x+15,y-10); ctx.stroke();
  } else if(p.kind==="note"){
    ctx.fillStyle = C.note; rr(x-12,y-9,24,18,2); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.globalAlpha = .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x-7,y-2); ctx.lineTo(x+7,y-2); ctx.moveTo(x-7,y+3); ctx.lineTo(x+4,y+3); ctx.stroke(); ctx.globalAlpha = 1;
  } else if(p.kind==="strip"){
    ctx.fillStyle = C.surface; ctx.strokeStyle = p.done ? C.good : C.muted; ctx.lineWidth = 1.5; rr(x-18,y-4.5,36,9,2); ctx.fill(); ctx.stroke();
  }
}
function draw(now){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle = C.floor; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = C.line; ctx.globalAlpha = .45; ctx.lineWidth = 1;
  for(let x=40;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=40;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  const st = step(), tg = targets(), pulse = (Math.sin(now/280)+1)/2;
  // board
  ctx.fillStyle = C.surface; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; rr(BOARD.x,BOARD.y,BOARD.w,BOARD.h,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.font = FONT(700,13.5,1); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  centerText(wrap(st.board || sim.board, BOARD.w-28, 2), 400, BOARD.y+BOARD.h/2, 18);
  ctx.textAlign = "center";
  sim.layouts[layoutName].furn.forEach(drawFurn);
  Object.values(propPos).forEach(drawProp);
  tg.forEach(t=>{
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.setLineDash([7,6]);
    if(t==="board"){ rr(BOARD.x-8-pulse*4, BOARD.y-6-pulse*3, BOARD.w+16+pulse*8, BOARD.h+12+pulse*6, 10); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(t.x, t.y, t.r+pulse*4, 0, Math.PI*2); ctx.stroke(); }
    ctx.setLineDash([]);
  });
  let focus = [];
  if(st.kind==="decide" && S.arrived[S.idx]) focus = st.focus || [];
  if(st.kind==="round" && round().cur!==null) focus = st.visits[round().cur].focus || [];
  students.forEach(s=>{
    if(focus.includes(s.name)){ ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(s.x,s.y,21,0,Math.PI*2); ctx.stroke(); }
    ctx.fillStyle = C[colorKey(s.name)]; ctx.beginPath(); ctx.arc(s.x,s.y,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = C.dotInk; ctx.font = FONT(700,11); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s.name.slice(0,2), s.x, s.y+.5);
  });
  if(tg.includes("board")) badge(BOARD.x+BOARD.w+4, BOARD.y+4, false, pulse);
  else if(st.kind==="decide" && tg.length){ const t = tg[0]; badge(t.x+t.r*.7, t.y-t.r*.7, false, pulse); }
  if(st.kind==="round") st.visits.forEach((v,t)=>{ const done = visitDone(S.idx,t); if(done || tg.includes(v.region)) badge(v.region.x+v.region.r*.7, v.region.y-v.region.r*.7, done, pulse); });
  // teacher
  const bob = teacher.tx!==null ? Math.sin(teacher.walk)*2 : 0;
  ctx.fillStyle = C.ink; ctx.globalAlpha = .15; ctx.beginPath(); ctx.ellipse(teacher.x, teacher.y+18, 16, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = C.accent; ctx.beginPath(); ctx.ellipse(teacher.x, teacher.y+4+bob*.3, 17, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(teacher.x, teacher.y-8+bob, 10, 0, Math.PI*2); ctx.fill();
  ctx.font = FONT(700,11); ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillText("You", teacher.x, teacher.y+18);
  const idle = teacher.tx===null && (st.kind==="decide" ? !S.arrived[S.idx] : st.kind==="round" && round().cur===null);
  if(tg.length && idle) bubble(teacher.x, teacher.y-22, st.kind==="round" ? "Click a glowing spot to visit" : `Click the glowing ${st.spotName || (spotOf(st) ? "spot" : "board")}`, true);
  students.forEach(s=>{ if(s.until > now) bubble(s.x, s.y-19, s.say, false); });
}
let last = performance.now();
function loop(now){ const dt = Math.min(.05, (now-last)/1000); last = now; if(sim && !$("simview").hidden){ update(dt); draw(now); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* ---------- panel ---------- */
function chips(){ return [...new Set(sim.steps.map(s=>s.chip))]; }
function renderStepper(){
  const list = chips(), cur = step().chip;
  $("stepper").innerHTML = list.map((p,k)=>`<li class="${p===cur?'now':''}"><button data-c="${esc(p)}" ${p===cur?'aria-current="step"':''}>${p==="Recap"?"":(k+1)+". "}${esc(p)}</button></li>`).join("");
  $("stepper").querySelectorAll("button").forEach(b=>b.onclick=()=>go(sim.steps.findIndex(x=>x.chip===b.dataset.c)));
}
function avatar(n){ return `<div class="av" style="background:var(--${colorKey(n)});color:var(--dot-ink)" aria-hidden="true">${esc(n.slice(0,2))}</div>`; }
const dialogue = lines => (lines && lines.length) ? `<div class="dialogue">${lines.map(([n,l])=>`<div class="line">${avatar(n)}<div class="bubble"><b>${esc(n)}</b>${esc(l)}</div></div>`).join("")}</div>` : "";
function question(q, opts, tr){
  const done = solved(opts, tr);
  let h = `<h3>${esc(q)}</h3><div class="options">${opts.map((o,j)=>{ const was = tr.includes(j); return `<button class="opt ${was?(o.ok?'right':'wrong'):''}" data-j="${j}" ${done||was?'disabled':''}><span class="k">${"ABC"[j]}</span><span>${esc(o.t)}</span></button>`; }).join("")}</div>`;
  if(tr.length){ const o = opts[tr[tr.length-1]]; h += `<div class="fb ${o.ok?'strong':'weak'}"><div><span class="pill ${o.ok?'strong':'weak'}">${o.ok?'Good choice':'Not quite'}</span></div><p>${esc(o.f)}</p>${o.ok?"":`<p class="hint">Try another answer.</p>`}</div>`; }
  if(done) h += `<button class="ex" id="redo" style="justify-self:start">Clear my answer and try again</button>`;
  return h;
}
function nav(){
  return `<div class="row navrow">${S.idx>0?`<button class="btn ghost" id="back">← Back</button>`:""}${S.idx<sim.steps.length-1 && canAdvance()?`<button class="btn" id="next">Next →</button>`:""}<span class="hint" style="align-self:center">Card ${S.idx+1} of ${sim.steps.length}</span></div>`;
}
function render(){
  const st = step();
  renderStepper();
  if(st.layout !== layoutName) applyLayout(st.layout);
  applyProps(st.props);
  const learns = sim.steps.filter(x=>x.kind==="learn");
  let html = "";
  if(st.kind==="learn"){
    const n = learns.indexOf(st)+1;
    html = `<div class="eyebrow">Step ${n} of ${learns.length} · ${esc(st.chip)}</div>
      <div class="row" style="align-items:center;gap:14px"><span class="stepnum">${n}</span><h2>${esc(st.title)}</h2></div>
      <p>${esc(st.text)}</p>${st.tip?`<p class="tip">${esc(st.tip)}</p>`:""}${nav()}`;
  } else if(st.kind==="round"){
    const r = round(), total = st.visits.length, count = st.visits.filter((_,t)=>visitDone(S.idx,t)).length;
    if(r.cur===null){
      html = `<div class="eyebrow">Your turn · ${esc(st.chip)}</div><h2>${esc(st.title)}</h2><p>${esc(st.text)}</p>
        <p class="tip">Click a glowing spot in the room, or use the buttons below. Visit them in any order.</p>
        <div class="checklist"><div class="ck-head"><b>${count} of ${total} visited</b><div class="bar"><i style="width:${count/total*100}%"></i></div></div>
        ${st.visits.map((v,t)=>{ const done = visitDone(S.idx,t), started = !done && (r.tried[t]||[]).length;
          return `<div class="ck"><span class="ck-name">${v.key?`<i style="background:var(--${v.key})"></i>`:""}${esc(v.label)}</span>
            <span class="pill ${done?'strong':started?'weak':'mixed'}">${done?'✓ Done':started?'Try again':'Not visited'}</span>
            <button class="ex" data-v="${t}">${done?'Revisit':'Go'}</button></div>`; }).join("")}</div>
        ${roundDone()?`<div class="notice">${esc(st.doneNote || "You've checked on every group. Notice that not every group needed you. Part of monitoring is knowing when to leave a group alone.")}</div>`:""}
        ${nav()}`;
    } else {
      const t = r.cur, v = st.visits[t], tr = (r.tried[t] ||= []);
      const nx = st.visits.map((_,i)=>i).find(i=>i!==t && !visitDone(S.idx,i));
      html = `<div class="eyebrow">Visiting · ${count} of ${total} done</div><h2>${esc(v.label)}</h2>${dialogue(v.lines)}
        ${v.opts ? question(v.q, v.opts, tr) : `<div class="fb strong"><div><span class="pill strong">On track</span></div><p>${esc(v.note)}</p></div>`}
        <div class="row">${visitDone(S.idx,t) && nx!==undefined?`<button class="btn" id="nextspot">Go to ${esc(st.visits[nx].label)}</button>`:""}
        <button class="btn ghost" id="list">See all</button></div>${nav()}`;
    }
  } else if(st.kind==="decide"){
    const where = st.spotName || (spotOf(st) ? "spot" : "board");
    if(!S.arrived[S.idx]){
      html = `<div class="eyebrow">Your turn · ${esc(st.chip)}</div><h2>${esc(st.title)}</h2><p>${esc(st.setup)}</p>
        <p class="tip">Click the glowing ${where} to walk over.</p>
        <div class="row"><button class="btn" id="walk">Walk there</button></div>${nav()}`;
    } else {
      html = `<div class="eyebrow">Your turn · ${esc(st.chip)}</div><h2>${esc(st.title)}</h2><p>${esc(st.setup)}</p>${dialogue(st.lines)}${question(st.q, st.opts, triedAt())}${nav()}`;
    }
  } else {
    const items = [];
    sim.steps.forEach((s,i)=>{
      if(s.kind==="decide") items.push([s.opts, S.tried[i]]);
      if(s.kind==="round") s.visits.forEach((v,t)=>{ if(v.opts) items.push([v.opts, (S.rounds[i]?.tried||{})[t]]); });
    });
    const answered = items.filter(([,tr])=>tr && tr.length), first = answered.filter(([o,tr])=>o[tr[0]].ok).length;
    html = `<div class="eyebrow">All done</div><h2>That's ${esc(sim.name)}</h2>
      ${answered.length===items.length ? `<p>You chose the strongest move on the first try in ${first} of ${items.length} decisions.</p>` : `<p>You've answered ${answered.length} of ${items.length} decisions. Use the steps at the top to go back to any of them.</p>`}
      <div><h3>The steps</h3><ol class="steps-list" style="margin-top:8px">${sim.recap.steps.map(([b,t])=>`<li><b>${esc(b)}</b> ${esc(t)}</li>`).join("")}</ol></div>
      <div><h3>Your task as the teacher</h3><ul class="list" style="margin-top:8px">${sim.recap.jobs.map(j=>`<li>${esc(j)}</li>`).join("")}</ul></div>
      <div class="row navrow"><button class="btn ghost" id="back">← Back</button><button class="btn ghost" id="again">Start over</button><a class="btn" href="#">Try another technique</a></div>`;
  }
  const stage = $("stage"); stage.innerHTML = html;

  if(st.kind==="learn"){ const who = sim, at = S.idx; (st.chatter||[]).forEach(([n,l],i)=>setTimeout(()=>{ if(sim===who && S.idx===at) sayAs(n,l,3800); }, 900+i*1400)); }
  if((st.kind==="learn" || st.kind==="summary") && teacher.tx===null && Math.hypot(teacher.x-TOP.x, teacher.y-TOP.y) > 10) walkTo(TOP);
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const j = +b.dataset.j;
    if(st.kind==="round"){ const r = round(); (r.tried[r.cur] ||= []).push(j); } else triedAt().push(j);
    render();
  });
  stage.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>visit(+b.dataset.v));
  if($("redo")) $("redo").onclick = ()=>{ if(st.kind==="round"){ const r = round(); r.tried[r.cur] = []; } else S.tried[S.idx] = []; render(); };
  if($("nextspot")){ const r = round(); const nx = st.visits.map((_,i)=>i).find(i=>i!==r.cur && !visitDone(S.idx,i)); $("nextspot").onclick = ()=>visit(nx); }
  if($("list")) $("list").onclick = ()=>{ round().cur = null; clearSpeech(); render(); };
  if($("next")) $("next").onclick = ()=>go(S.idx+1);
  if($("back")) $("back").onclick = ()=>go(S.idx-1);
  if($("walk")) $("walk").onclick = goToDecide;
  if($("again")) $("again").onclick = ()=>{ S.tried = {}; S.arrived = {}; S.rounds = {}; S.idx = -1; go(0); };
}
function go(i){
  if(i<0 || i>=sim.steps.length || i===S.idx) return;
  S.idx = i; teacher.onArrive = null; teacher.tx = null; clearSpeech();
  if(step().kind==="round") round().cur = null;
  render();
  if(window.innerWidth < 820) $("stage").scrollIntoView({behavior:"smooth", block:"start"});
}
document.addEventListener("keydown", e=>{
  if(!sim || $("simview").hidden) return;
  const a = document.activeElement;
  if(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) return;
  if(e.key==="ArrowRight" && canAdvance()){ e.preventDefault(); go(S.idx+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); go(S.idx-1); }
});

/* ---------- home + routing ---------- */
const GROUPS = [["pairs","Pairs and fours","Students work with a partner, sometimes joining a second pair."],["groups","Small groups","Groups of four work together on a shared task."],["moving","Moving around the room","Students change places to respond, debate, or observe."]];
function renderHome(){
  $("home").innerHTML = GROUPS.map(([g,title,sub])=>`<section class="hgroup"><div><h2>${title}</h2><p class="sub">${sub}</p></div>
    <div class="cards">${SIMS.filter(s=>s.group===g).map(s=>`<a class="card" href="#${s.id}">
      <span class="card-name">${esc(s.name)}</span><span class="card-blurb">${esc(s.blurb)}</span>
      <span class="card-meta">${esc(s.format)}${s.time?` · ${esc(s.time)}`:""}</span><span class="card-go">Start →</span></a>`).join("")}</div></section>`).join("");
}
function showHome(){
  sim = null; $("simview").hidden = true; $("home").hidden = false; $("homeBtn").hidden = true; $("stepper").hidden = true;
  $("eyebrow").textContent = "Beginner walkthroughs · Collaborative active learning";
  $("h1").textContent = "Active Learning Sims";
  $("sub").textContent = "Walk a virtual classroom of 16 students and practice facilitating twelve collaborative active learning techniques. Each sim teaches the steps, sends you to visit groups, and asks you to make a few teaching decisions.";
  window.scrollTo(0,0);
}
function openSim(id){
  sim = BY_ID[id];
  S = SAVED[id] ||= {idx:0, tried:{}, arrived:{}, rounds:{}};
  $("home").hidden = true; $("simview").hidden = false; $("homeBtn").hidden = false; $("stepper").hidden = false;
  $("eyebrow").textContent = `Beginner walkthrough · ${sim.format}`;
  $("h1").textContent = sim.name;
  $("sub").textContent = sim.blurb + " Move back and forth with the buttons, the steps below, or your ← → keys.";
  $("legend").innerHTML = (sim.legend||[]).map(([l,k])=>`<span><i style="background:var(--${k})"></i>${esc(l)}</span>`).join("");
  $("legend").hidden = !sim.legend;
  $("about").innerHTML = `<h3>About ${esc(sim.name)}</h3>
    <dl class="facts"><dt>Format</dt><dd>${esc(sim.format)}</dd>${sim.time?`<dt>Time to run</dt><dd>${esc(sim.time)} minimum</dd>`:""}</dl>
    ${sim.roles.map(([t,d])=>`<details><summary>${esc(t)}</summary><p>${esc(d)}</p></details>`).join("")}`;
  applyLayout(step().layout, true); applyProps(step().props, true);
  if(step().kind==="round") round().cur = null;
  teacher.x = TOP.x; teacher.y = TOP.y; teacher.tx = null; teacher.onArrive = null; clearSpeech();
  resize(); render(); window.scrollTo(0,0);
}
function route(){ const id = decodeURIComponent(location.hash.slice(1)); if(BY_ID[id]) openSim(id); else showHome(); }
$("homeBtn").onclick = ()=>{ location.hash = ""; };
window.addEventListener("hashchange", route);
renderHome(); route();
</script>
</body>
</html>
